name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  publish:
    if: vars.PUBLIC_RELEASE_AUTHORIZED == 'true'
    environment: public-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@v3
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/organelle
          tags: |
            type=semver,pattern={{version}}
            type=sha,format=long
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
      - name: Sign image by immutable digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/organelle
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
      - name: Attest image provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/organelle
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Create source archive and checksums
        run: |
          git archive --format=tar.gz --prefix="organelle-${GITHUB_REF_NAME}/" -o "organelle-${GITHUB_REF_NAME}.tar.gz" HEAD
          sha256sum "organelle-${GITHUB_REF_NAME}.tar.gz" > SHA256SUMS
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run:
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
          "organelle-${GITHUB_REF_NAME}.tar.gz" SHA256SUMS
