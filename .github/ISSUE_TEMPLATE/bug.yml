name: Bug report
description: Report a reproducible Organelle defect
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value:
        Do not report security vulnerabilities or include personal data. Use private
        vulnerability reporting for security issues.
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: v0.1.0 or image digest
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: Deployment
      options: [Docker Compose, Local development, Other]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and redacted logs
    validations:
      required: true
